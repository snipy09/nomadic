<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2338E0" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Nomadic Technologies" />
    <meta name="application-name" content="Nomadic" />

    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="google4ed478e1b3b2df1b" />

    <!--
      Runs before first paint. `js` lets CSS hide below-the-fold reveals only when scripts are running, so content
      never stays hidden. The intro plays once per visit, never with reduced motion, and always lifts by itself.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');

        var skip = false;
        try {
          skip =
            window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
            window.sessionStorage.getItem('nomadic-intro') === '1';
        } catch (e) {}
        if (skip) return;

        root.classList.add('has-preloader', 'preloading');
        var started = Date.now();
        var done = false;

        function finish() {
          if (done) return;
          done = true;
          try {
            window.sessionStorage.setItem('nomadic-intro', '1');
          } catch (e) {}
          var curtain = document.getElementById('preloader');
          root.classList.remove('preloading');
          if (!curtain) {
            root.classList.remove('has-preloader');
            return;
          }
          curtain.classList.add('leaving');
          setTimeout(function () {
            root.classList.remove('has-preloader');
            if (curtain.parentNode) curtain.parentNode.removeChild(curtain);
          }, 760);
        }

        // The logo needs about 1.2s to draw. Lift as soon as that has played and the page has loaded.
        function whenReady() {
          setTimeout(finish, Math.max(0, 1250 - (Date.now() - started)));
        }
        if (document.readyState === 'complete') whenReady();
        else window.addEventListener('load', whenReady);
        setTimeout(finish, 4000);
      })();
    </script>

    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        place-items: center;
        background: #0a0f2c;
      }
      html.has-preloader #preloader {
        display: grid;
      }
      html.preloading {
        overflow: hidden;
      }
      /* The marigold line is the progress bar, and becomes the leading edge as the curtain lifts. */
      #preloader::after {
        content: '';
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 6px;
        background: #ffc21a;
        transform-origin: left;
        animation: pl-line 1150ms cubic-bezier(0.6, 0, 0.2, 1) both;
      }
      .pl-logo {
        width: min(78vw, 30rem);
        height: auto;
        overflow: visible;
      }
      .pl-bar {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: pl-grow 520ms cubic-bezier(0.2, 0.7, 0.1, 1) both;
      }
      .pl-bar-r {
        animation-delay: 90ms;
      }
      .pl-slash {
        animation: pl-wipe 560ms cubic-bezier(0.5, 0, 0.1, 1) 230ms both;
      }
      .pl-stroke {
        stroke-dasharray: 1;
        animation: pl-draw 380ms cubic-bezier(0.4, 0, 0.2, 1) calc(360ms + var(--i) * 60ms) both;
      }
      .pl-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: pl-pop 380ms cubic-bezier(0.3, 1.6, 0.5, 1) 980ms both;
      }
      #preloader.leaving {
        transform: translateY(-100%);
        transition: transform 680ms cubic-bezier(0.76, 0, 0.24, 1);
      }
      #preloader.leaving .pl-logo {
        opacity: 0;
        transition: opacity 240ms ease-out;
      }
      @keyframes pl-grow {
        from { transform: scaleY(0); }
        to   { transform: scaleY(1); }
      }
      @keyframes pl-wipe {
        from { clip-path: inset(0 100% 100% 0); }
        to   { clip-path: inset(0 0 0 0); }
      }
      @keyframes pl-draw {
        from { stroke-dashoffset: 1; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes pl-pop {
        from { transform: scale(0); }
        to   { transform: scale(1); }
      }
      @keyframes pl-line {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
    </style>


    <!-- Title, description, canonical, share tags and structured data are written per page at build time. -->
    <!--seo-head-->
  </head>
  <body>
    <!-- Brand intro. Outside the app root so it never takes part in hydration; the script above removes it. -->
    <div id="preloader" aria-hidden="true">
      <svg class="pl-logo" xmlns="http://www.w3.org/2000/svg" viewBox="18 23 456 82" focusable="false">
        <path class="pl-bar" d="M24 29H50V99H24Z" fill="#fff" />
        <path class="pl-bar pl-bar-r" d="M78 29H104V99H78Z" fill="#fff" />
        <path class="pl-slash" d="M24 29H50L104 99H78Z" fill="#FFC21A" />
        <g transform="translate(128 99)" fill="none" stroke="#fff" stroke-width="14">
          <path class="pl-stroke" style="--i: 0" pathLength="1" d="M7 0V-44M37 0V-22A15 15 0 0 0 7 -22" />
          <circle class="pl-stroke" style="--i: 1" pathLength="1" cx="72" cy="-22" r="15" />
          <path
            class="pl-stroke"
            style="--i: 2"
            pathLength="1"
            d="M107 0V-44M137 0V-22A15 15 0 0 0 107 -22M167 0V-22A15 15 0 0 0 137 -22"
          />
          <circle class="pl-stroke" style="--i: 3" pathLength="1" cx="202" cy="-22" r="15" />
          <path class="pl-stroke" style="--i: 3" pathLength="1" d="M217 0V-44" />
          <circle class="pl-stroke" style="--i: 4" pathLength="1" cx="252" cy="-22" r="15" />
          <path class="pl-stroke" style="--i: 4" pathLength="1" d="M267 0V-70" />
          <path class="pl-stroke" style="--i: 5" pathLength="1" d="M288 0V-44" />
          <path class="pl-stroke" style="--i: 6" pathLength="1" d="M335.15 -32.04A15 15 0 1 0 335.15 -11.96" />
          <circle class="pl-dot" cx="288" cy="-59" r="8" fill="#FFC21A" stroke="none" />
        </g>
      </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
