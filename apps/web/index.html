    <title>Nomadic: the whole job search, on your desktop</title>
    <meta name="title" content="Nomadic: the whole job search, on your desktop" />

      name="description"
      content="Nomadic is a desktop app for the whole job search. Follow a learning roadmap for your target role, find openings straight from company hiring pages, let it fill in application forms, and track every application on one board. Windows download coming soon."
    />
    <meta name="author" content="Nomadic Technologies" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://nomadicai.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nomadicai.vercel.app/" />
    <meta property="og:site_name" content="Nomadic" />

      property="og:description"
      content="Learn the skills, find the openings, apply with forms that fill themselves, and track it all. One desktop app. Windows download coming soon."

      name="twitter:description"
      content="Learn the skills, find the openings, apply with forms that fill themselves, and track it all. One desktop app."

    <!-- The FAQ structured data is rendered from the visible FAQ so the two never drift apart. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://nomadicai.vercel.app/#software",
            "name": "Nomadic",
            "operatingSystem": "Windows",
            "applicationCategory": "BusinessApplication",
            "description": "A desktop app for the whole job search: learning roadmaps, job discovery from company hiring pages, application form automation and an application tracker.",
            "url": "https://nomadicai.vercel.app/",
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "INR",
                "description": "One roadmap preview, ten curated jobs, three company question sets and two textbooks."
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "249",
                "priceCurrency": "INR",
                "description": "Per month. All roadmaps, 428+ company question sets, the full job board, semi-automatic applications and recruiter contacts."
              },
              {
                "@type": "Offer",
                "name": "Max",
                "price": "599",
                "priceCurrency": "INR",
                "description": "Per month. Everything in Pro plus unlimited autonomous applications and background recruiter outreach."
              }
            ]
          },
          {
            "@type": "Organization",
            "@id": "https://nomadicai.vercel.app/#organization",
            "name": "Nomadic Technologies",
            "url": "https://nomadicai.vercel.app/",
            "logo": "https://nomadicai.vercel.app/logo-icon.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://nomadicai.vercel.app/#website",
            "url": "https://nomadicai.vercel.app/",
            "name": "Nomadic",
            "publisher": { "@id": "https://nomadicai.vercel.app/#organization" }
          }
        ]
      }

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
