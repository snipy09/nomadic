name: Android app

# Builds the Nomadic Android app (apps/android: Capacitor + the shared UI and services) into a
# debug APK, then installs it on an emulator and checks it starts: the in-WebView host must log
# "[Nomadic] host ready" and the sign-in screen must be on screen. The APK is uploaded as an artifact.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/android/**'
      - 'packages/app-core/**'
      - 'packages/app-ui/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'packages/learning/**'
      - 'packages/supabase/src/**'
      - 'package-lock.json'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and smoke-test the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the web app and copy it into the Android project
        working-directory: apps/android
        run: |
          npx vite build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nomadic-android-debug-${{ github.run_number }}
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$ANDROID_HOME/ndk"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash apps/android/scripts/emulator-smoke.sh apps/android/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomadic-android-smoke-${{ github.run_number }}
          path: |
            smoke-logcat.txt
            smoke-ui.xml
            smoke-screen.png
          if-no-files-found: ignore
