name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Baseline has ~100 known type errors (see REVAMP_PLAN.md); report, don't block, until they are burned down.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
