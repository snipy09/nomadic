<!doctype html><html><head><title>Apply now - Internshala</title></head><body>
<div id="application_modal" class="modal show" role="dialog" style="display:block"><div class="modal-body">
<h4>Applying to Web Development Internship at Acme</h4>
<form id="application_form" onsubmit="return false">
<div class="form-group"><label for="cover_letter">Why should you be hired for this role? *</label><textarea id="cover_letter" name="cover_letter" required></textarea></div>
<div class="form-group"><label>Your availability</label>
 <div class="radio"><label><input type="radio" name="availability" value="1"> Yes, I am available for 6 months</label></div>
 <div class="radio"><label><input type="radio" name="availability" value="2"> No (Please specify your availability)</label></div></div>
<div class="form-group"><label for="assess1">Have you worked with Node.js? Describe briefly. *</label><textarea id="assess1" name="assess1" required></textarea></div>
<div class="form-group"><label for="pp">Portfolio/GitHub link</label><input id="pp" name="pp"></div>
<button id="submit" type="submit">Submit</button></form></div></div></body></html>
