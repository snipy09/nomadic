<!doctype html><html><head><title>Workday - My Information</title></head><body>
<div data-automation-id="applyFlowMyInfoPage"><h2>My Information</h2>
<div data-automation-id="formField-source"><label for="source--source" >How Did You Hear About Us?<abbr>*</abbr></label><input id="source--source" data-automation-id="source" type="text"></div>
<div><label id="cn-label">Country/Territory<abbr>*</abbr></label><select id="country" aria-labelledby="cn-label"><option value="">Select One</option><option>United States of America</option><option>India</option></select></div>
<div data-automation-id="formField-legalNameSection_firstName"><label for="legalNameSection_firstName">Given Name(s)<abbr>*</abbr></label><input id="legalNameSection_firstName" data-automation-id="legalNameSection_firstName"></div>
<div data-automation-id="formField-legalNameSection_lastName"><label for="legalNameSection_lastName">Family Name<abbr>*</abbr></label><input id="legalNameSection_lastName" data-automation-id="legalNameSection_lastName"></div>
<div><label for="addr1">Address Line 1<abbr>*</abbr></label><input id="addr1" autocomplete="address-line1"></div>
<div><label for="city">City<abbr>*</abbr></label><input id="city" data-automation-id="addressSection_city"></div>
<div><label for="email">Email Address<abbr>*</abbr></label><input id="email" type="email"></div>
<div><label for="pn">Phone Number<abbr>*</abbr></label><input id="pn" type="tel" data-automation-id="phone-number"></div>
</div></body></html>
