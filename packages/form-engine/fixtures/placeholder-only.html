<!doctype html><html><head><title>Careers - Join Acme</title></head><body>
<h2>Apply for Data Analyst</h2><form onsubmit="return false">
<input type="text" name="fullName" placeholder="Full name *" required>
<input type="email" name="email" placeholder="Email address *" required>
<input type="tel" name="phone" placeholder="Phone number">
<input type="text" name="linkedin" placeholder="LinkedIn profile URL">
<input type="text" name="city" placeholder="City">
<div role="group" aria-labelledby="g1"><span id="g1">Do you require visa sponsorship?</span>
 <label><input type="radio" name="visa" value="y"> Yes</label><label><input type="radio" name="visa" value="n"> No</label></div>
<div><span id="wa">Notice period</span><input type="text" aria-labelledby="wa" name="np"></div>
<input type="file" name="cv" aria-label="Upload your CV" required>
<textarea name="msg" placeholder="Why do you want to work with us?"></textarea>
<button>Apply</button></form></body></html>
