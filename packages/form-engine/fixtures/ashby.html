<!doctype html><html><head><title>Acme Labs Jobs - Ashby</title><style>button.active{background:#222;color:#fff}._fieldEntry{margin:10px 0}</style></head><body>
<div id="app"><h1>Backend Engineer</h1><form onsubmit="return false">
<div class="_fieldEntry"><label class="_label" for="_systemfield_name">Name <span>*</span></label><input id="_systemfield_name" name="_systemfield_name" type="text" required></div>
<div class="_fieldEntry"><label class="_label" for="_systemfield_email">Email <span>*</span></label><input id="_systemfield_email" name="_systemfield_email" type="email" required></div>
<div class="_fieldEntry"><label class="_label" for="_systemfield_resume">Resume <span>*</span></label><input id="_systemfield_resume" name="_systemfield_resume" type="file" style="opacity:0;position:absolute;width:1px;height:1px"><button type="button" onclick="document.getElementById('_systemfield_resume').click()">Upload File</button></div>
<div class="_fieldEntry"><label class="_label" for="q-location">Where are you currently located?</label><input id="q-location" name="q-location" type="text"></div>
<div class="_fieldEntry"><label class="_label" for="q-li">LinkedIn Profile <span>*</span></label><input id="q-li" name="q-li" type="text" required></div>
<div class="_fieldEntry required"><div class="_label">Are you legally authorized to work in the United States?</div>
 <div class="_yesno" id="yn1"><button type="button">Yes</button><button type="button">No</button></div></div>
<div class="_fieldEntry required"><div class="_label">Do you now, or will you in the future, require sponsorship for employment visa status?</div>
 <div class="_yesno" id="yn2"><button type="button">Yes</button><button type="button">No</button></div></div>
<div class="_fieldEntry"><div class="_label">Are you comfortable working from our San Francisco office 3 days a week?</div>
 <div class="_yesno" id="yn3"><button type="button">Yes</button><button type="button">No</button></div></div>
<div class="_fieldEntry"><label class="_label" for="q-sal">What are your salary expectations?</label><input id="q-sal" name="q-sal" type="text"></div>
<div class="_fieldEntry"><label class="_label" for="q-start">When could you start?</label><input id="q-start" name="q-start" type="text"></div>
<button type="submit">Submit Application</button></form></div>
<script>document.querySelectorAll('._yesno').forEach(g=>g.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;g.querySelectorAll('button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');}));</script></body></html>
