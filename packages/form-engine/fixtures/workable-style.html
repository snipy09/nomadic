<!doctype html><html><head><title>Apply - Workable</title></head><body><main>
<form onsubmit="return false" data-ui="application-form">
<section><h3>Personal information</h3>
<div data-ui="firstname"><label for="firstname">First name</label><input id="firstname" name="firstname" type="text" aria-required="true"></div>
<div data-ui="lastname"><label for="lastname">Last name</label><input id="lastname" name="lastname" type="text" aria-required="true"></div>
<div data-ui="email"><label for="email">Email</label><input id="email" name="email" type="email" aria-required="true"></div>
<div data-ui="headline"><label for="headline">Headline</label><input id="headline" name="headline" type="text"></div>
<div data-ui="phone"><label for="phone">Phone</label><select id="cc" aria-label="Country code"><option>+1</option><option selected>+91</option></select><input id="phone" name="phone" type="tel"></div>
<div data-ui="address"><label for="address">Address</label><input id="address" name="address" type="text"></div>
</section>
<section><h3>Profile</h3><div><label for="summary">Summary</label><textarea id="summary" name="summary"></textarea></div>
<div><label for="cv">Resume</label><input type="file" id="cv" name="resume"></div></section>
<section><h3>Details</h3>
<div><label for="ans1">What is your current CTC (in LPA)? *</label><input id="ans1" name="QA_1"></div>
<div><label for="ans2">What is your expected CTC? *</label><input id="ans2" name="QA_2"></div>
<div><label for="ans3">What is your notice period? *</label><input id="ans3" name="QA_3"></div>
<div><label for="ans4">Are you comfortable with a fully remote role? *</label><select id="ans4" name="QA_4"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
</section>
<div><label><input type="checkbox" name="gdpr" required> I agree to the processing of my personal data as described in the privacy policy *</label></div>
<button type="submit">Submit application</button></form></main></body></html>
