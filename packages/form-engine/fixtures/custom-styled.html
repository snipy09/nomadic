<!doctype html><html><head><title>Apply - Custom ATS</title><style>
.cb input{opacity:0;position:absolute;width:0;height:0}.cb span{display:inline-block;border:1px solid #999;padding:4px 10px;cursor:pointer}.cb input:checked+span{background:#def}
</style></head><body><form onsubmit="return false">
<label for="fn">First name *</label><input id="fn" name="fn" required><label for="ln">Last name *</label><input id="ln" name="ln" required>
<label for="em">Email *</label><input id="em" name="em" type="email" required>
<fieldset><legend>Are you legally eligible to work in India?</legend>
 <label class="cb"><input type="radio" name="elig" value="1"><span>Yes</span></label><label class="cb"><input type="radio" name="elig" value="0"><span>No</span></label></fieldset>
<fieldset><legend>Are you willing to relocate?</legend>
 <label class="cb"><input type="radio" name="reloc" value="1"><span>Yes</span></label><label class="cb"><input type="radio" name="reloc" value="0"><span>No</span></label></fieldset>
<fieldset><legend>Gender</legend>
 <label class="cb"><input type="radio" name="g" value="m"><span>Male</span></label><label class="cb"><input type="radio" name="g" value="f"><span>Female</span></label><label class="cb"><input type="radio" name="g" value="x"><span>Prefer not to say</span></label></fieldset>
<label class="cb"><input type="checkbox" id="consent" name="consent" required><span>I agree to the Privacy Policy and consent to the processing of my personal data</span></label>
<label class="cb"><input type="checkbox" id="news" name="news"><span>Send me job alerts and marketing updates</span></label>
<button>Submit</button></form></body></html>
