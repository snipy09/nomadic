<!doctype html><html><head><title>Apply | SmartRecruiters</title><style>.hint{color:#888}</style></head><body>
<spl-form><form onsubmit="return false">
<div class="field"><label for="f1">First name</label><input id="f1" name="firstName" autocomplete="given-name" required></div>
<div class="field"><label for="f2">Last name</label><input id="f2" name="lastName" autocomplete="family-name" required></div>
<div class="field"><label for="f3">Email</label><input id="f3" name="email" autocomplete="email" required></div>
<div class="field"><label for="f4">Confirm your email</label><input id="f4" name="confirmEmail" required></div>
<div class="field"><label for="f5">Phone</label><input id="f5" name="phoneNumber" autocomplete="tel" required></div>
<div class="field"><label for="f6">Web (Portfolio, Blog, Website)</label><input id="f6" name="web"></div>
<div class="field"><span id="q9">Are you at least 18 years old?</span><div role="radiogroup" aria-labelledby="q9"><label><input type="radio" name="age" value="1">Yes</label><label><input type="radio" name="age" value="0">No</label></div></div>
<div class="field"><label for="f7">Tell us why you're a great fit</label><textarea id="f7" name="fit"></textarea></div>
</form></spl-form></body></html>
