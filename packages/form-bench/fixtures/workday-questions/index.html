<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Engineer - Orion Logistics Careers</title>
<link rel="stylesheet" href="../_shared/fixture.css">
<script src="../_shared/runtime.js"></script>

</head>
<body class="">

<div data-automation-id="wd-app" class="wd-root">
  <header data-automation-id="header"><span data-automation-id="headerTitle">Orion Logistics Careers</span></header>
  <div data-automation-id="jobPostingHeader"><h1>Platform Engineer</h1></div>
  
  <form data-automation-id="applyFlowForm"><section  data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeaderTitle">Application Questions</h2>
  <div data-automation-id="formField-q1" class="css-wd-field" data-field>
  <label for="input-1" id="label-input-1">Are you legally authorized to work in the country for which you are applying?<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-1" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-1 input-1" data-automation-id="q1" data-wd-select="q1" data-label="Are you legally authorized to work in the country for which you are applying?" data-options="[&quot;Yes&quot;,&quot;No&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="q1" value="">
</div>
  <div data-automation-id="formField-q2" class="css-wd-field" data-field>
  <label for="input-2" id="label-input-2">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B)?<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-2" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-2 input-2" data-automation-id="q2" data-wd-select="q2" data-label="Will you now or in the future require sponsorship for employment visa status (e.g., H-1B)?" data-options="[&quot;Yes&quot;,&quot;No&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="q2" value="">
</div>
  <fieldset data-automation-id="formField-q3" class="css-wd-field" data-field>
  <legend><label id="label-3">Are you willing to relocate for this position?<abbr title="required" aria-hidden="true">*</abbr></label></legend>
  <div role="radiogroup" aria-labelledby="label-3"><div class="css-wd-radio"><input type="radio" id="q3-0" name="q3" value="Yes" aria-required="true" data-controlled-choice="q3"><label for="q3-0">Yes</label></div><div class="css-wd-radio"><input type="radio" id="q3-1" name="q3" value="No" aria-required="true" data-controlled-choice="q3"><label for="q3-1">No</label></div></div>
</fieldset>
  <div data-automation-id="formField-q4" class="css-wd-field" data-field>
  <label for="input-4" id="label-input-4">Earliest Start Date<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-4" type="text" data-automation-id="q4" aria-required="true" placeholder="MM/DD/YYYY" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-q5" class="css-wd-field" data-field>
  <label for="input-5" id="label-input-5">Desired Salary<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-5" type="text" data-automation-id="q5" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-q6" class="css-wd-field" data-field>
  <label for="input-6" id="label-input-6">Do you have any relatives currently employed by Orion Logistics?<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-6" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-6 input-6" data-automation-id="q6" data-wd-select="q6" data-label="Do you have any relatives currently employed by Orion Logistics?" data-options="[&quot;Yes&quot;,&quot;No&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="q6" value="">
</div>
  <div data-automation-id="formField-q7" class="css-wd-field" data-field>
  <label for="input-7" id="label-input-7">Highest Level of Education<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-7" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-7 input-7" data-automation-id="q7" data-wd-select="q7" data-label="Highest Level of Education" data-options="[&quot;High School Diploma&quot;,&quot;Bachelor's Degree&quot;,&quot;Master's Degree&quot;,&quot;Doctorate&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="q7" value="">
</div>
  <div data-automation-id="formField-q8" class="css-wd-field" data-field>
  <label for="input-8" id="label-input-8">Please describe your experience building distributed systems.<abbr title="required" aria-hidden="true">*</abbr></label>
  <textarea id="input-8" data-automation-id="q8" aria-required="true" data-controlled></textarea>
</div>
  <div data-automation-id="pageFooter"><button type="submit" data-automation-id="bottom-navigation-submit-button">Submit</button></div>
</section></form>
</div>
</body>
</html>
