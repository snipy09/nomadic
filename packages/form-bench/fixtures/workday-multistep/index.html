<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senior Software Engineer - Meridian Health Careers</title>
<link rel="stylesheet" href="../_shared/fixture.css">
<script src="../_shared/runtime.js"></script>

</head>
<body class="">

<div data-automation-id="wd-app" class="wd-root">
  <header data-automation-id="header"><span data-automation-id="headerTitle">Meridian Health Careers</span></header>
  <div data-automation-id="jobPostingHeader"><h1>Senior Software Engineer</h1></div>
  <ol data-automation-id="progressBar"><li>My Information</li><li>Application Questions</li><li>Voluntary Disclosures</li><li>Review</li></ol><div>Current step: <span data-step-label></span></div>
  <form data-automation-id="applyFlowForm"><section data-step="My Information" data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeaderTitle">My Information</h2>
  <div data-automation-id="formField-sourceDropdown" class="css-wd-field" data-field>
  <label for="input-1" id="label-input-1">How Did You Hear About Us?<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-1" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-1 input-1" data-automation-id="sourceDropdown" data-wd-select="sourceDropdown" data-label="How Did You Hear About Us?" data-options="[&quot;Company Website&quot;,&quot;LinkedIn&quot;,&quot;Indeed&quot;,&quot;Referral&quot;,&quot;Other&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="sourceDropdown" value="">
</div>
  <fieldset data-automation-id="formField-candidateIsPreviousWorker" class="css-wd-field" data-field>
  <legend><label id="label-2">Have you previously worked for Meridian Health as an employee or contractor?<abbr title="required" aria-hidden="true">*</abbr></label></legend>
  <div role="radiogroup" aria-labelledby="label-2"><div class="css-wd-radio"><input type="radio" id="candidateIsPreviousWorker-0" name="candidateIsPreviousWorker" value="Yes" aria-required="true" data-controlled-choice="candidateIsPreviousWorker"><label for="candidateIsPreviousWorker-0">Yes</label></div><div class="css-wd-radio"><input type="radio" id="candidateIsPreviousWorker-1" name="candidateIsPreviousWorker" value="No" aria-required="true" data-controlled-choice="candidateIsPreviousWorker"><label for="candidateIsPreviousWorker-1">No</label></div></div>
</fieldset>
  <div data-automation-id="formField-countryDropdown" class="css-wd-field" data-field>
  <label for="input-3" id="label-input-3">Country<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-3" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-3 input-3" data-automation-id="countryDropdown" data-wd-select="countryDropdown" data-label="Country" data-options="[&quot;India&quot;,&quot;United Kingdom&quot;,&quot;United States of America&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="countryDropdown" value="">
</div>
  <div data-automation-id="formField-legalNameSection_firstName" class="css-wd-field" data-field>
  <label for="input-4" id="label-input-4">First Name<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-4" type="text" data-automation-id="legalNameSection_firstName" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-legalNameSection_lastName" class="css-wd-field" data-field>
  <label for="input-5" id="label-input-5">Last Name<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-5" type="text" data-automation-id="legalNameSection_lastName" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-addressSection_addressLine1" class="css-wd-field" data-field>
  <label for="input-6" id="label-input-6">Address Line 1</label>
  <div class="css-wd-input"><input id="input-6" type="text" data-automation-id="addressSection_addressLine1" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-addressSection_city" class="css-wd-field" data-field>
  <label for="input-7" id="label-input-7">City<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-7" type="text" data-automation-id="addressSection_city" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-addressSection_postalCode" class="css-wd-field" data-field>
  <label for="input-8" id="label-input-8">Postal Code<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-8" type="text" data-automation-id="addressSection_postalCode" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-email" class="css-wd-field" data-field>
  <label for="input-9" id="label-input-9">Email Address<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-9" type="email" data-automation-id="email" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="formField-phone-device-type" class="css-wd-field" data-field>
  <label for="input-10" id="label-input-10">Phone Device Type<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-10" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-10 input-10" data-automation-id="phone-device-type" data-wd-select="phone-device-type" data-label="Phone Device Type" data-options="[&quot;Mobile&quot;,&quot;Home&quot;,&quot;Work&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="phone-device-type" value="">
</div>
  <div data-automation-id="formField-phone-number" class="css-wd-field" data-field>
  <label for="input-11" id="label-input-11">Phone Number<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-11" type="tel" data-automation-id="phone-number" aria-required="true" data-controlled value=""></div>
</div>
  <div data-automation-id="pageFooter"><button type="button" data-automation-id="bottom-navigation-next-button" data-next>Save and Continue</button></div>
</section>
<section data-step="Application Questions" data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeaderTitle">Application Questions</h2>
  <div data-automation-id="formField-q-authorized" class="css-wd-field" data-field>
  <label for="input-12" id="label-input-12">Are you legally authorized to work in the country for which you are applying?<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-12" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-12 input-12" data-automation-id="q-authorized" data-wd-select="q-authorized" data-label="Are you legally authorized to work in the country for which you are applying?" data-options="[&quot;Yes&quot;,&quot;No&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="q-authorized" value="">
</div>
  <div data-automation-id="formField-q-sponsorship" class="css-wd-field" data-field>
  <label for="input-13" id="label-input-13">Will you now or in the future require sponsorship for employment visa status?<abbr title="required" aria-hidden="true">*</abbr></label>
  <button type="button" id="input-13" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-13 input-13" data-automation-id="q-sponsorship" data-wd-select="q-sponsorship" data-label="Will you now or in the future require sponsorship for employment visa status?" data-options="[&quot;Yes&quot;,&quot;No&quot;]" aria-required="true" value="">Select One</button>
  <input type="hidden" name="q-sponsorship" value="">
</div>
  <div data-automation-id="formField-dateSectionStart" class="css-wd-field" data-field>
  <label for="input-14" id="label-input-14">Earliest Start Date<abbr title="required" aria-hidden="true">*</abbr></label>
  <div class="css-wd-input"><input id="input-14" type="text" data-automation-id="dateSectionStart" aria-required="true" placeholder="MM/DD/YYYY" data-controlled value=""></div>
</div>
  <div data-automation-id="pageFooter"><button type="button" data-automation-id="bottom-navigation-next-button" data-next>Save and Continue</button></div>
</section>
<section data-step="Voluntary Disclosures" data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeaderTitle">Voluntary Disclosures</h2>
  <div data-automation-id="formField-gender" class="css-wd-field" data-field>
  <label for="input-15" id="label-input-15">Gender</label>
  <button type="button" id="input-15" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-15 input-15" data-automation-id="gender" data-wd-select="gender" data-label="Gender" data-options="[&quot;Male&quot;,&quot;Female&quot;,&quot;I do not wish to self-identify&quot;]" value="">Select One</button>
  <input type="hidden" name="gender" value="">
</div>
  <div data-automation-id="formField-ethnicityDropdown" class="css-wd-field" data-field>
  <label for="input-16" id="label-input-16">Ethnicity</label>
  <button type="button" id="input-16" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-16 input-16" data-automation-id="ethnicityDropdown" data-wd-select="ethnicityDropdown" data-label="Ethnicity" data-options="[&quot;American Indian or Alaskan Native&quot;,&quot;Asian&quot;,&quot;Black or African American&quot;,&quot;Hispanic or Latino&quot;,&quot;White&quot;,&quot;Native Hawaiian or Other Pacific Islander&quot;,&quot;Two or More Races&quot;,&quot;I do not wish to self-identify&quot;]" value="">Select One</button>
  <input type="hidden" name="ethnicityDropdown" value="">
</div>
  <div data-automation-id="formField-veteranStatus" class="css-wd-field" data-field>
  <label for="input-17" id="label-input-17">Veteran Status</label>
  <button type="button" id="input-17" class="css-wd-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="label-input-17 input-17" data-automation-id="veteranStatus" data-wd-select="veteranStatus" data-label="Veteran Status" data-options="[&quot;I am a veteran&quot;,&quot;I identify as one or more of the classifications of protected veteran&quot;,&quot;I am not a protected veteran&quot;,&quot;I don't wish to answer&quot;]" value="">Select One</button>
  <input type="hidden" name="veteranStatus" value="">
</div>
  <div data-automation-id="formField-agreementCheckbox" class="css-wd-field" data-field>
  <div class="css-wd-checkbox"><input type="checkbox" id="agreementCheckbox" data-automation-id="agreementCheckbox" aria-required="true" data-controlled-choice="agreementCheckbox" value="on"><label for="agreementCheckbox">Yes, I have read and consent to the terms and conditions</label></div>
</div>
  <div data-automation-id="pageFooter"><button type="button" data-automation-id="bottom-navigation-next-button" data-next>Save and Continue</button></div>
</section>
<section data-step="Review" data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeaderTitle">Review</h2>
  
  <div data-automation-id="pageFooter"><button type="submit" data-automation-id="bottom-navigation-submit-button">Submit</button></div>
</section></form>
</div>
</body>
</html>
