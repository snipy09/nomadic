<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Application for Senior Software Engineer at Brightline</title>
<link rel="stylesheet" href="../_shared/fixture.css">
<script src="../_shared/runtime.js"></script>

</head>
<body class="">
<div id="wrapper"><div id="app_body"><div id="header"><h1 class="app-title">Senior Software Engineer</h1><span class="company-name">at Brightline</span><div class="location">Austin, TX</div></div><div id="content"><p>We are looking for engineers who love shipping.</p></div><div id="application">
  <h2 id="application_header">Apply for this Job</h2>
  <div id="required_fields_text"><span class="asterisk">*</span> Required</div>
  <form id="application_form" accept-charset="UTF-8" method="post" enctype="multipart/form-data" action="/embed/job_app">
    <div id="main_fields"><div class="field">
  <label for="first_name">First Name <span class="asterisk">*</span></label>
  <input type="text" id="first_name" name="job_application[first_name]" aria-required="true" autocomplete="given-name" maxlength="255">
</div>
<div class="field">
  <label for="last_name">Last Name <span class="asterisk">*</span></label>
  <input type="text" id="last_name" name="job_application[last_name]" aria-required="true" autocomplete="family-name" maxlength="255">
</div>
<div class="field">
  <label for="email">Email <span class="asterisk">*</span></label>
  <input type="email" id="email" name="job_application[email]" aria-required="true" maxlength="255">
</div>
<div class="field">
  <label for="phone">Phone <span class="asterisk">*</span></label>
  <input type="tel" id="phone" name="job_application[phone]" aria-required="true" maxlength="255">
</div>
<div class="field" id="resume_fieldset">
  <label>Resume/CV <span class="asterisk">*</span></label>
  <div class="attach-or-paste" data-field="resume">
    <button type="button" class="button" data-source="attach">Attach</button>
    <button type="button" class="button" data-source="dropbox">Dropbox</button>
    <button type="button" class="link" data-source="paste">or enter manually</button>
    <input type="file" id="resume_file" name="job_application[resume]" style="visibility:hidden;position:absolute;left:-9999px" aria-required="true">
  </div>
  <div class="accepted-filetypes">(File types: pdf, doc, docx, txt, rtf)</div>
</div></div>
    <div id="custom_fields"><div class="field">
  <label>LinkedIn Profile
    <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" maxlength="255">
  </label>
  <input type="hidden" name="job_application[answers_attributes][0][question_id]" value="4000">
</div>
<div class="field">
  <label>Website
    <input type="text" id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" maxlength="255">
  </label>
  <input type="hidden" name="job_application[answers_attributes][1][question_id]" value="4001">
</div>
<div class="field">
  <label>Are you legally authorized to work in the United States? <span class="asterisk">*</span><br>
    <select id="job_application_answers_attributes_2_boolean_value" name="job_application[answers_attributes][2][boolean_value]" class="select2-offscreen" tabindex="-1" aria-required="true"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
  </label>
  <input type="hidden" name="job_application[answers_attributes][2][question_id]" value="4002">
</div>
<div class="field">
  <label>Will you now or in the future require sponsorship for employment visa status (e.g. H-1B visa status)? <span class="asterisk">*</span><br>
    <select id="job_application_answers_attributes_3_boolean_value" name="job_application[answers_attributes][3][boolean_value]" class="select2-offscreen" tabindex="-1" aria-required="true"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
  </label>
  <input type="hidden" name="job_application[answers_attributes][3][question_id]" value="4003">
</div>
<div class="field">
  <label>What is your desired annual compensation? <span class="asterisk">*</span>
    <input type="text" id="job_application_answers_attributes_4_text_value" name="job_application[answers_attributes][4][text_value]" aria-required="true" maxlength="255">
  </label>
  <input type="hidden" name="job_application[answers_attributes][4][question_id]" value="4004">
</div></div>
    
    <div id="submit_buttons"><input type="button" id="submit_app" value="Submit Application" onclick="this.form.requestSubmit()"></div>
  </form>
</div></div></div>
</body>
</html>
