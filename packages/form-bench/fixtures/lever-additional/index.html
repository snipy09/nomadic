<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint - Full Stack Engineer</title>
<link rel="stylesheet" href="../_shared/fixture.css">
<script src="../_shared/runtime.js"></script>

</head>
<body class="">

<div class="page-application">
  <div class="main-header page-full-width section-wrapper"><div class="main-header-content page-centered narrow-section"><a class="main-header-logo" href="#">Waypoint</a></div></div>
  <div class="section-wrapper page-full-width"><div class="section page-centered posting-header"><div class="posting-headline"><h2>Full Stack Engineer</h2><div class="posting-categories"><div class="sort-by-time posting-category">Austin, TX</div><div class="sort-by-team posting-category">Engineering</div></div></div></div></div>
  <form id="application-form" method="POST" enctype="multipart/form-data" data-qa="application-form">
    <div class="section page-centered application-form"><h4>Submit your application</h4><ul><li class="application-question resume">
  <label><div class="application-label">Resume/CV<span class="required">&#10033;</span></div>
  <div class="application-field"><a class="postings-btn template-btn-utility visible-resume-upload"><input type="file" id="resume-upload-input" name="resume" class="application-file-input" style="opacity:0;position:absolute;width:1px;height:1px" required><span class="default-label">ATTACH RESUME/CV</span><span class="filename"></span></a></div></label>
</li>
<li class="application-question">
  <label><div class="application-label">Full name<span class="required">&#10033;</span></div>
  <div class="application-field"><input type="text" name="name" data-qa="name-input" required></div></label>
</li>
<li class="application-question">
  <label><div class="application-label">Email<span class="required">&#10033;</span></div>
  <div class="application-field"><input type="email" name="email" data-qa="email-input" required></div></label>
</li>
<li class="application-question">
  <label><div class="application-label">Phone</div>
  <div class="application-field"><input type="text" name="phone" data-qa="phone-input"></div></label>
</li>
<li class="application-question">
  <label><div class="application-label">Current company</div>
  <div class="application-field"><input type="text" name="org" data-qa="org-input"></div></label>
</li></ul></div>
<div class="section page-centered application-form"><h4>Education</h4><ul><li class="application-question custom-question">
  <div class="application-label full-width text">University</div>
  <div class="application-field full-width"><input type="text" name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field0]" class="card-field-input"></div>
</li>
<li class="application-question custom-question">
  <div class="application-label full-width">Highest level of education completed<span class="required">&#10033;</span></div>
  <div class="application-field full-width"><select name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field1]" required><option value="">Select...</option><option value="High School">High School</option><option value="Associate's Degree">Associate's Degree</option><option value="Bachelor's Degree">Bachelor's Degree</option><option value="Master's Degree">Master's Degree</option><option value="PhD">PhD</option></select></div>
</li>
<li class="application-question custom-question">
  <div class="application-label full-width text">Graduation year</div>
  <div class="application-field full-width"><input type="text" name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field2]" class="card-field-input"></div>
</li></ul></div>
<div class="section page-centered application-form"><h4>Questions</h4><ul><li class="application-question custom-question">
  <div class="application-label full-width">Which languages can you work in professionally?</div>
  <div class="application-field full-width"><ul data-qa="checkboxes"><li><label><input type="checkbox" name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field3]" value="English"><span class="application-answer-alternative">English</span></label></li><li><label><input type="checkbox" name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field3]" value="Spanish"><span class="application-answer-alternative">Spanish</span></label></li><li><label><input type="checkbox" name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field3]" value="French"><span class="application-answer-alternative">French</span></label></li><li><label><input type="checkbox" name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field3]" value="German"><span class="application-answer-alternative">German</span></label></li></ul></div>
</li>
<li class="application-question custom-question">
  <div class="application-label full-width text">What excites you about Waypoint?<span class="required">&#10033;</span></div>
  <div class="application-field full-width"><textarea name="cards[8b48537c-f41b-44bc-a262-b262f60f8b48][field4]" class="card-field-input" required></textarea></div>
</li></ul></div>
<div class="section page-centered application-form"><h4>Additional information</h4><ul><li class="application-question">
  <div class="application-field full-width"><textarea name="comments" id="additional-information" class="card-field-input" placeholder="Add a cover letter or anything else you want to share."></textarea></div>
</li></ul></div>
    <div class="section page-centered last-section-submit"><button type="submit" class="postings-btn template-btn-submit hex-color" id="btn-submit" data-qa="btn-submit">Submit application</button></div>
  </form>
</div>
</body>
</html>
