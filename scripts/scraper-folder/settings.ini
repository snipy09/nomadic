; NOMADIC SCRAPERS - settings
; Edit, save, done: the next run uses the new values. Lines starting with ; are notes.

[schedule]
; Hours between runs of each scraper while this computer is on and signed in. 0 turns a scraper off.
; Auto scraping checks every 30 minutes and runs whatever is due (Start auto scraping.cmd turns it on).
jobs = 6
news = 3
hackathons = 12
companies = 12
contacts = 24
discover = 168

[general]
; india = keep only jobs and events open to people in India. all = keep everything.
region = india

[jobs]
; New jobs added to Supabase per run (best first; the rest come next run). Known jobs are always refreshed.
max_new_per_run = 1000
; Jobs posted longer ago than this are not added, and stored ones expire (Supabase migration 033 does the same).
max_age_days = 30
; Naukri and Indeed restrict scraping in their terms and break often. yes = include them anyway.
include_naukri_and_indeed = no
; Listing pages read per run.
internshala_pages = 5
unstop_pages = 34
careers_pages = 10

[news]
; Articles older than this are skipped.
max_age_days = 30
; Feed ids to skip, comma separated (ids are listed in reports\news\latest-news.txt), e.g. feeds_off = ht-jobs, et-it
feeds_off =

[adzuna]
; Only used when ADZUNA_APP_ID and ADZUNA_APP_KEY are in .env (Setup.cmd asks). Free limit: 250 calls a day.
max_calls_per_run = 40
